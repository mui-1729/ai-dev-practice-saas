<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>アメリカンドッグ注文管理 MVP</title>
<style>
:root{--ink:#1d1d1b;--paper:#f5f1e8;--panel:#fffdf8;--orange:#ef7b2d;--orange-dark:#d75d12;--green:#355f4b;--line:#ded7c9;--muted:#706b62;--shadow:0 18px 45px rgba(45,36,24,.10)}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 10%,rgba(246,199,77,.20),transparent 25rem),var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button{font:inherit;cursor:pointer}button:disabled{cursor:wait;opacity:.58}.topbar{position:sticky;top:0;z-index:20;padding:12px 14px;background:rgba(255,253,248,.94);border-bottom:1px solid rgba(222,215,201,.85);backdrop-filter:blur(14px)}.nav{display:flex;gap:6px;max-width:620px;margin:auto;padding:4px;background:#ece6da;border-radius:14px}.nav button{flex:1;border:0;text-align:center;color:var(--muted);padding:10px 8px;border-radius:10px;background:transparent;font-weight:800;font-size:14px}.nav button.active{color:#fff;background:var(--ink)}.view{display:none}.view.active{display:block}.page{width:min(1120px,calc(100% - 28px));margin:auto;padding:42px 0 80px}.page-heading{margin-bottom:26px}.page-heading h1{margin:6px 0 5px;font-size:clamp(38px,7vw,58px);letter-spacing:-.045em}.page-heading p{margin:0;color:var(--muted)}.eyebrow{color:var(--orange-dark);font-size:12px;font-weight:900;letter-spacing:.18em}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.register-page{max-width:720px}.register-panel{padding:clamp(22px,5vw,40px)}.price-row,.total-row{display:flex;justify-content:space-between;align-items:baseline;gap:20px}.price-row{padding-bottom:24px;border-bottom:1px solid var(--line)}.price-row span,.total-row span{color:var(--muted);font-weight:700}.price-row strong{font-size:28px}.quantity-block{padding:28px 0}.field-label{display:block;margin-bottom:12px;color:var(--muted);font-weight:800}.quantity-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quantity-buttons button{min-height:88px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);font-size:36px;font-weight:900;transition:.18s ease}.quantity-buttons small{font-size:14px;margin-left:3px}.quantity-buttons button.selected{border-color:var(--orange);background:#fff4e9;transform:translateY(-2px)}.total-row{padding:22px 0;border-top:1px solid var(--line)}.total-row strong{font-size:clamp(38px,8vw,54px)}.primary-button,.secondary-button{width:100%;border:0;border-radius:16px;padding:17px 20px;font-weight:900}.primary-button{background:var(--orange);color:#fff;box-shadow:0 9px 24px rgba(239,123,45,.28)}.primary-button:hover{background:var(--orange-dark)}.primary-button.compact{padding:13px 15px}.secondary-button{background:var(--ink);color:#fff}.error-message{margin:15px 0 0;color:#b32929;font-weight:700}.ticket{margin-top:22px;padding:26px;text-align:center;color:#fff;border-radius:24px;background:var(--green);box-shadow:var(--shadow)}.ticket span,.ticket small{display:block}.ticket span{font-weight:800;letter-spacing:.08em}.ticket strong{display:block;margin:2px 0;font-size:78px;line-height:1}.ticket small{opacity:.74}.kitchen-heading{display:flex;justify-content:space-between;align-items:end;gap:20px}.count-badge{padding:10px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800}.kitchen-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;align-items:start}.order-column{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.56)}.order-column header{padding:17px 20px;border-bottom:1px solid var(--line)}.order-column.waiting header{background:#fff6d9}.order-column.preparing header{background:#ffeadb}.order-column h2{margin:0;font-size:19px}.order-list{display:grid;gap:12px;padding:14px}.order-card{padding:18px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 18px rgba(45,36,24,.06)}.order-card-top{display:flex;justify-content:space-between;align-items:center}.order-card-top strong{font-size:25px}.order-card-top time{color:var(--muted);font-weight:700}.order-quantity{margin:16px 0;font-size:48px;font-weight:900;line-height:1}.order-quantity small{margin-left:4px;font-size:16px}.column-empty{padding:46px 20px;text-align:center;color:var(--muted)}.call-page{min-height:calc(100vh - 65px);padding:46px clamp(18px,4vw,56px) 80px;background:var(--green);color:#fff}.call-header{text-align:center}.call-header .eyebrow{color:#ffd77d}.call-header h1{margin:7px 0 8px;font-size:clamp(40px,8vw,70px);letter-spacing:-.05em}.call-header p{margin:0;opacity:.72}.call-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;max-width:1060px;margin:42px auto 0}.call-card{padding:25px;text-align:center;border-radius:24px;background:var(--panel);color:var(--ink);box-shadow:0 20px 45px rgba(0,0,0,.18)}.call-card span{display:block;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.16em}.call-card strong{display:block;margin:4px 0 18px;font-size:86px;line-height:1}.call-card button{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:800}.call-empty{display:grid;gap:8px;place-items:center;min-height:320px;text-align:center}.call-empty strong{font-size:30px}.call-empty span{opacity:.68}@media(max-width:700px){.page{padding-top:30px}.page-heading h1{font-size:40px}.quantity-buttons button{min-height:76px}.kitchen-heading{align-items:start;flex-direction:column}.kitchen-grid{grid-template-columns:1fr}.call-page{padding-top:34px}.call-card strong{font-size:74px}}
</style>
</head>
<body>
<header class="topbar"><nav class="nav" aria-label="画面切り替え"><button class="active" data-view-button="register">レジ</button><button data-view-button="kitchen">厨房</button><button data-view-button="call">呼び出し</button></nav></header>
<section id="view-register" class="view active"><main class="page register-page"><header class="page-heading"><span class="eyebrow">REGISTER</span><h1>注文を登録</h1><p>アメリカンドッグ</p></header><section class="panel register-panel"><div class="price-row"><span>1個あたり</span><strong id="price">¥300</strong></div><div class="quantity-block"><span class="field-label">数量</span><div class="quantity-buttons" role="group" aria-label="数量を選択"><button class="selected" data-quantity="1">1<small>個</small></button><button data-quantity="2">2<small>個</small></button><button data-quantity="3">3<small>個</small></button></div></div><div class="total-row"><span>合計</span><strong id="total">¥300</strong></div><button id="submit-order" class="primary-button">注文を登録する</button><p id="register-error" class="error-message" role="alert" hidden></p></section><section id="ticket" class="ticket" aria-live="polite" hidden><span>呼び出し番号</span><strong id="ticket-number">1</strong><small>この番号をお客様へお伝えください</small></section></main></section>
<section id="view-kitchen" class="view"><main class="page"><header class="page-heading kitchen-heading"><div><span class="eyebrow">KITCHEN</span><h1>厨房ボード</h1></div><div id="pending-count" class="count-badge">未処理 0件</div></header><div class="kitchen-grid"><section class="order-column waiting"><header><h2>未調理</h2></header><div id="waiting-list" class="order-list"></div></section><section class="order-column preparing"><header><h2>調理中</h2></header><div id="preparing-list" class="order-list"></div></section></div></main></section>
<section id="view-call" class="view"><main class="call-page"><header class="call-header"><span class="eyebrow">NOW CALLING</span><h1>お呼び出し中</h1><p>番号をご確認のうえ、受け取り口までお越しください</p></header><div id="call-content"></div></main></section>
<script>
(()=>{const O='corndog-mvp-orders-v2',S='corndog-mvp-settings-v2',D={currentPrice:300,nextOrderNumber:1};const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},orders=()=>read(O,[]),settings=()=>read(S,D),save=(k,v)=>{localStorage.setItem(k,JSON.stringify(v));renderAll()},yen=v=>'¥'+v.toLocaleString('ja-JP'),time=v=>new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date(v)),esc=v=>String(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));let quantity=1;
function showView(name){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`));document.querySelectorAll('[data-view-button]').forEach(b=>b.classList.toggle('active',b.dataset.viewButton===name));location.hash=name}
document.querySelectorAll('[data-view-button]').forEach(b=>b.onclick=()=>showView(b.dataset.viewButton));
function createOrder(){const s=settings(),now=new Date().toISOString(),o={id:crypto.randomUUID(),orderNumber:s.nextOrderNumber,quantity,unitPrice:s.currentPrice,status:'waiting',createdAt:now,updatedAt:now};localStorage.setItem(O,JSON.stringify([...orders(),o]));localStorage.setItem(S,JSON.stringify({...s,nextOrderNumber:s.nextOrderNumber+1}));renderAll();return o}
function updateStatus(id,status){save(O,orders().map(o=>o.id===id?{...o,status,updatedAt:new Date().toISOString()}:o))}
const price=document.querySelector('#price'),total=document.querySelector('#total'),qButtons=[...document.querySelectorAll('[data-quantity]')],submit=document.querySelector('#submit-order'),ticket=document.querySelector('#ticket'),ticketNumber=document.querySelector('#ticket-number');function renderRegister(){const s=settings();price.textContent=yen(s.currentPrice);total.textContent=yen(s.currentPrice*quantity);qButtons.forEach(b=>b.classList.toggle('selected',+b.dataset.quantity===quantity))}qButtons.forEach(b=>b.onclick=()=>{quantity=+b.dataset.quantity;renderRegister()});submit.onclick=async()=>{submit.disabled=true;submit.textContent='登録中…';await new Promise(r=>setTimeout(r,300));const o=createOrder();ticketNumber.textContent=o.orderNumber;ticket.hidden=false;quantity=1;renderRegister();submit.disabled=false;submit.textContent='注文を登録する'};
function card(o,next,label,klass){return `<article class="order-card"><div class="order-card-top"><strong>#${esc(o.orderNumber)}</strong><time>${time(o.createdAt)}</time></div><div class="order-quantity">${esc(o.quantity)}<small>個</small></div><button class="${klass}" data-order-id="${esc(o.id)}" data-next-status="${next}">${label}</button></article>`}
function renderKitchen(){const all=orders(),waiting=all.filter(o=>o.status==='waiting').sort((a,b)=>a.createdAt.localeCompare(b.createdAt)),preparing=all.filter(o=>o.status==='preparing').sort((a,b)=>a.createdAt.localeCompare(b.createdAt));document.querySelector('#pending-count').textContent=`未処理 ${waiting.length+preparing.length}件`;document.querySelector('#waiting-list').innerHTML=waiting.length?waiting.map(o=>card(o,'preparing','調理開始','secondary-button')).join(''):'<div class="column-empty">新しい注文はありません</div>';document.querySelector('#preparing-list').innerHTML=preparing.length?preparing.map(o=>card(o,'ready','完成','primary-button compact')).join(''):'<div class="column-empty">調理中の注文はありません</div>'}
function renderCall(){const ready=orders().filter(o=>o.status==='ready').sort((a,b)=>a.updatedAt.localeCompare(b.updatedAt));document.querySelector('#call-content').innerHTML=ready.length?`<div class="call-grid">${ready.map(o=>`<article class="call-card"><span>ORDER</span><strong>${esc(o.orderNumber)}</strong><button data-complete-id="${esc(o.id)}">受け渡し済み</button></article>`).join('')}</div>`:'<div class="call-empty"><strong>ただいま準備中です</strong><span>完成した番号がここに表示されます</span></div>'}
document.addEventListener('click',e=>{const step=e.target.closest('[data-order-id]');if(step)updateStatus(step.dataset.orderId,step.dataset.nextStatus);const done=e.target.closest('[data-complete-id]');if(done)updateStatus(done.dataset.completeId,'completed')});function renderAll(){renderRegister();renderKitchen();renderCall()}renderAll();showView(['register','kitchen','call'].includes(location.hash.slice(1))?location.hash.slice(1):'register')})();
</script>
</body>
</html>
